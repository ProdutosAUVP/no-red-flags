name: Plugin package

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build plugin
        run: python scripts/build_plugin.py
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: no-red-flags-plugin
          path: dist/no-red-flags-plugin-*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download validated plugin
        uses: actions/download-artifact@v4
        with:
          name: no-red-flags-plugin
          path: dist
      - name: Attach package to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" dist/no-red-flags-plugin-*.zip --generate-notes --verify-tag
